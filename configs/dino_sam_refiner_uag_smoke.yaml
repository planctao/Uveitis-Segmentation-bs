project:
  name: dino_sam_refiner_uag_smoke
  seed: 42
runtime:
  device: cpu
  amp: false
  num_workers: 0
data:
  ignore_index: 255
cache:
  root: outputs/dino_refiner_cache/vsubr_vw05_compact_smoke
train:
  folds_to_run: [f1]
  batch_size: 1
  epochs: 1
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  clip_grad_norm: 1.0
  max_train_samples: 4
  max_val_samples: 2
model:
  type: uncertainty_gated
  feature_mode: soft_signed
  in_channels: 17
  out_channels: 2
  base_channels: 4
  residual_scale: 1.0
  dropout: 0.1
clicks:
  threshold: 0.5
  radius: 4
  mode: gaussian
  strategy: farthest
  cumulative: true
  iterative: true
  jitter: 1.0
  dropout: 0.1
  train_clicks: [0, 1]
  eval_clicks: [0, 1]
loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  consistency_weight: 0.1
  consistency_confidence: 0.4
  click_bce_weight: 0.2
  click_area_gain: 4.0
  click_consistency_weight: 0.05
  click_logit_margin: 2.0
metric:
  threshold: 0.5
  select_clicks: 1
outputs:
  root: outputs/interactive_refiner_runs
