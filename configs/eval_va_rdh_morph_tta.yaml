project:
  name: uveitis_eval_va_rdh_morph_tta
  seed: 42

runtime:
  device: cuda
  precision: amp
  num_workers: 8

data:
  root: dataset/dataset/split_dataorigin
  image_dir: img
  mask_dir: mask_only_itksnap
  hrnet_result_dir: HRNet_Result
  image_extensions: [.jpg, .jpeg, .png, .bmp, .tif, .tiff]
  mask_extensions: [.nii.gz, .nii, .png, .jpg, .jpeg, .bmp, .tif, .tiff]
  result_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]
  folds: [f1, f2, f3, f4, f5]
  label_values: [0, 1, 2, 3]
  ignore_index: 255

train:
  image_size: [768, 768]
  batch_size: 8
  grad_accum_steps: 1
  epochs: 30
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  min_learning_rate: 0.0000001
  scheduler: cosine
  weight_decay: 0.0001
  freeze_backbone: false
  amp: true
  clip_grad_norm: 1.0
  progress_log_interval: 50
  save_interval: 5
  sample_interval: 5
  ema_enabled: false
  ema_decay: 0.999
  ema_start_epoch: 1
  lesion1_sample_weight: 1.0
  lesion2_sample_weight: 6.0
  sampler_epoch_multiplier: 1.0
  max_train_samples:
  max_val_samples:
  folds_to_run: [f1, f2, f3, f4, f5]

model:
  backbone: dinov3_convnext_tiny
  variant: tiny
  dinov3_code_dir: backbone/dinov3
  backbone_weights: weights/dinov3_convnext_tiny_pretrain_lvd1689m-21b726bb.pth
  decoder_channels: 192
  decoder_attention: none
  decoder_attention_reduction: 16
  decoder_deep_supervision: false
  aux_loss_weight: 0.4
  num_outputs: 2
  head: rdh
  rdh:
    dynamics: pde
    iters: 8
    dt: 0.2
    reaction: fisher
    use_image_conductance: true
    lambda: 0.1
    rho: 1.0
    kappa: 0.1
    diffusion_mode: anisotropic
    struct_pre_sigma: 1.0
    struct_rho_sigma: 2.0
    ced_alpha: 0.005
    ced_contrast: 1.0

loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  boundary_dice_weight: 0.0
  boundary_dice_kernel: 5
  hard_negative_ratio: 0.0
  hard_negative_min_pixels: 0

preprocess:
  enabled: false

metric:
  threshold: [0.50, 0.90]
  threshold_sweep:
    enabled: true
    postprocess: false
    fov_mask: false
    thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.60, 0.70, 0.80, 0.90]
  tta:
    enabled: true
    flips: [h, v, hv]
    scales: [1.0]
    size_multiple: 32
    uncertainty_penalty: [0.0, 0.0]
  adaptive_threshold:
    enabled: false
  postprocess:
    enabled: true
    close_kernel: [3, 3]
    open_kernel: [0, 0]
    min_component_area: [64, 16]
    max_components: [0, 0]
    component_score: area
    fill_holes_max_area: [128, 64]
    connectivity: 8
  intensity_refine:
    enabled: false
  fov_mask:
    enabled: true
    input_mode: imagenet
    threshold: 0.03
    channel_reduce: max
    close_kernel: 15
    open_kernel: 0
    erode_kernel: 0
    min_component_area: 4096
    fill_holes_max_area: 262144
    keep_largest: true
    fallback_full_if_empty: true
    connectivity: 8

augmentations:
  enabled: false

outputs:
  root: runs
