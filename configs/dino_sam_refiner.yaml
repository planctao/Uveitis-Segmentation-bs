project:
  name: dino_sam_refiner_vsubr_vw05_mvp
  seed: 42

runtime:
  device: cuda
  amp: true
  num_workers: 4

data:
  ignore_index: 255

cache:
  root: outputs/dino_refiner_cache/vsubr_vw05

train:
  folds_to_run: [f1, f2, f3, f4, f5]
  batch_size: 4
  epochs: 20
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  clip_grad_norm: 1.0

model:
  in_channels: 13
  out_channels: 2
  base_channels: 32
  residual_scale: 1.0
  dropout: 0.1

clicks:
  threshold: 0.5
  radius: 8
  mode: disk
  train_clicks: [0, 1, 3, 5]
  eval_clicks: [0, 1, 3, 5]

loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  boundary_dice_weight: 0.0
  boundary_dice_kernel: 5
  consistency_weight: 0.1
  consistency_confidence: 0.4
  click_bce_weight: 0.2
  click_area_gain: 4.0

metric:
  threshold: 0.5
  select_clicks: 3

outputs:
  root: outputs/interactive_refiner_runs
