project:
  name: fa_ubir_v1
  seed: 42

runtime:
  device: cuda
  amp: true
  num_workers: 0

data:
  ignore_index: 255

cache:
  root: outputs/dino_refiner_cache/vsubr_vw05_compact

train:
  folds_to_run: [f1, f2, f3, f4, f5]
  batch_size: 1
  epochs: 30
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  clip_grad_norm: 1.0

model:
  type: boundary_uncertainty
  in_channels: 19
  image_channels: 3
  out_channels: 2
  base_channels: 16
  residual_scale: 1.0
  dropout: 0.1
  require_click_for_residual: true
  fa_aware_input: true
  fa_aware_kernel: 5

uncertainty:
  type: learned_error_plus_entropy
  entropy_weight: 0.5
  learned_weight: 0.3
  boundary_conflict_weight: 0.2
  loss_weight: 0.2

boundary:
  target: band
  kernel: 5
  soft: true
  sigma: 1.5
  loss_weight: 0.2
  pos_weight: [5.0, 20.0]

clicks:
  threshold: 0.5
  radius: 8
  mode: gaussian
  strategy: farthest
  oracle_strategy: farthest
  cumulative: true
  jitter: 2.0
  dropout: 0.10
  min_separation: 16
  stop_priority: null
  train_clicks: [0, 1, 3]
  eval_clicks: [0, 1, 3, 5]

loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  click_consistency_weight: 0.05
  click_logit_margin: 2.0

refiner:
  roi_size: 0

evaluation:
  # Keep training-time validation short.  Full 0/1/3/5 oracle and policy
  # curves are computed once per fold after training.
  train_eval_clicks: [3]
  run_policy_during_training: false

storage:
  min_free_gb: 10.0

metric:
  select_clicks: 3
  threshold: 0.5

outputs:
  root: outputs/interactive_boundary_runs
