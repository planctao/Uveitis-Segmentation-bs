project:
  name: dino_sam_refiner_iterative_finetune
  seed: 42

runtime:
  device: cuda
  amp: true
  num_workers: 2

data:
  ignore_index: 255

cache:
  root: outputs/dino_refiner_cache/vsubr_vw05_compact

train:
  folds_to_run: [f1]
  batch_size: 2
  epochs: 8
  learning_rate: 0.00003
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  clip_grad_norm: 1.0

model:
  # Keep the exact MVP architecture so the initialization checkpoint is
  # shape-compatible; only the rollout objective changes.
  type: legacy
  feature_mode: legacy
  in_channels: 13
  out_channels: 2
  base_channels: 32
  residual_scale: 1.0
  dropout: 0.1

clicks:
  threshold: 0.5
  radius: 8
  mode: disk
  strategy: random
  cumulative: true
  iterative: true
  residual_step_limit: 0.5
  stop_gradient: false
  teacher_forcing_ratio: 0.75
  eval_teacher_forcing_ratio: 0.0
  teacher_forcing_logit_scale: 4.0
  jitter: 0.0
  dropout: 0.0
  train_clicks: [0, 1, 3, 5]
  eval_clicks: [0, 1, 3, 5]

loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  boundary_dice_weight: 0.0
  boundary_dice_kernel: 5
  consistency_weight: 0.1
  consistency_confidence: 0.4
  click_bce_weight: 0.2
  click_area_gain: 4.0
  click_consistency_weight: 0.0

metric:
  threshold: 0.5
  select_clicks: 3

outputs:
  root: outputs/interactive_refiner_runs
