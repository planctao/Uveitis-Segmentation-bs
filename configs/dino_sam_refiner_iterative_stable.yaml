project:
  name: dino_sam_refiner_vsubr_vw05_compact_iterative_stable
  seed: 42

runtime:
  device: cuda
  amp: true
  num_workers: 4

data:
  ignore_index: 255

cache:
  root: outputs/dino_refiner_cache/vsubr_vw05_compact

train:
  # This configuration is primarily for evaluation/deployment of an existing
  # legacy MVP checkpoint; no retraining is required.
  folds_to_run: [f1, f2, f3, f4, f5]
  batch_size: 4
  epochs: 1

model:
  type: legacy
  feature_mode: legacy
  in_channels: 13
  out_channels: 2
  base_channels: 32
  residual_scale: 1.0
  dropout: 0.1

clicks:
  threshold: 0.5
  radius: 8
  mode: disk
  strategy: random
  cumulative: true
  iterative: true
  residual_step_limit: 0.5
  total_residual_limit: 1.0
  stop_gradient: false
  teacher_forcing_ratio: 0.0
  eval_teacher_forcing_ratio: 0.0
  jitter: 0.0
  dropout: 0.0
  train_clicks: [0, 1, 3, 5]
  eval_clicks: [0, 1, 3, 5]

loss:
  pos_weight: [3.0, 60.0]
  bce_weight: 0.5
  tversky_weight: 1.0
  tversky_alpha: 0.2
  tversky_beta: 0.8
  focal_gamma: 0.75
  boundary_dice_weight: 0.0
  boundary_dice_kernel: 5
  consistency_weight: 0.1
  consistency_confidence: 0.4
  click_bce_weight: 0.2
  click_area_gain: 4.0

metric:
  threshold: 0.9
  select_clicks: 3

outputs:
  root: outputs/interactive_refiner_runs
